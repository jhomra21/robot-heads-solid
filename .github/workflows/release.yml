name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: npm-release-robot-heads-solid
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Run anti-slop rule regression
        run: bun test tools/oxlint/anti-slop/tests/geometry-vocabulary.test.ts
      - name: Verify approved release tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != "v${version}" ]]; then
            echo "Tag ${tag} does not match package version ${version}." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Release tag ${tag} must be annotated." >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi

          release_commit=""
          while read -r commit; do
            commit_version="$(git show "${commit}:package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
            if [[ "$commit_version" != "$version" ]]; then
              continue
            fi

            parent="$(git rev-parse "${commit}^" 2>/dev/null || true)"
            parent_version=""
            if [[ -n "$parent" ]] && git cat-file -e "${parent}:package.json" 2>/dev/null; then
              parent_version="$(git show "${parent}:package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')"
            fi
            if [[ "$parent_version" != "$version" ]]; then
              release_commit="$commit"
              break
            fi
          done < <(git log --first-parent --format=%H -- package.json)

          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag must point to the main commit that introduced version ${version}; found ${release_commit:-none}." >&2
            exit 1
          fi

          if [[ "$version" == *-beta.* ]]; then
            dist_tag=beta
          elif [[ "$version" == *-* ]]; then
            echo "Unsupported prerelease channel in ${version}; only beta prereleases are configured." >&2
            exit 1
          else
            dist_tag=latest
          fi

          dist_tags="$(npm view robot-heads-solid dist-tags --json --registry=https://registry.npmjs.org/ --prefer-online)"
          DIST_TAGS="$dist_tags" VERSION="$version" DIST_TAG="$dist_tag" node <<'NODE'
          const tags = JSON.parse(process.env.DIST_TAGS);
          const current = tags[process.env.DIST_TAG];
          if (!current) {
            throw new Error(`No existing npm ${process.env.DIST_TAG} dist-tag found; refusing an unverified first publication.`);
          }

          function parse(version) {
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.(0|[1-9]\d*))?$/.exec(version);
            if (!match) throw new Error(`Unsupported release version: ${version}`);
            return { core: match.slice(1, 4).map(BigInt), beta: match[4] === undefined ? null : BigInt(match[4]) };
          }

          function compare(leftVersion, rightVersion) {
            const left = parse(leftVersion);
            const right = parse(rightVersion);
            for (let index = 0; index < 3; index++) {
              if (left.core[index] !== right.core[index]) return left.core[index] < right.core[index] ? -1 : 1;
            }
            if (left.beta === right.beta) return 0;
            if (left.beta === null) return 1;
            if (right.beta === null) return -1;
            return left.beta < right.beta ? -1 : 1;
          }

          const result = compare(process.env.VERSION, current);
          if (result <= 0) {
            throw new Error(`${process.env.VERSION} must be strictly newer than existing ${process.env.DIST_TAG} version ${current}.`);
          }
          console.log(`${process.env.VERSION} is newer than existing ${process.env.DIST_TAG} version ${current}.`);
          NODE

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
      - name: Run lint, typecheck, and build
        run: bun run check
      - name: Run browser regressions
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e
      - name: Verify packed Solid consumer
        run: bun run e2e:consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-verification-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack release candidate
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          npm pack --json > release-artifact/pack.json
          filename="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].filename)')"
          package="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].name)')"
          version="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].version)')"
          integrity="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].integrity)')"

          if [[ "$package" != "robot-heads-solid" || "$version" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Packed identity ${package}@${version} does not match robot-heads-solid@${{ steps.release.outputs.version }}." >&2
            exit 1
          fi
          if [[ "$integrity" != sha512-* ]]; then
            echo "Unexpected npm integrity: ${integrity}" >&2
            exit 1
          fi
          mv "$filename" release-artifact/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm CLI with trusted publishing support
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release-artifact
      - name: Verify and publish exact package artifact
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected one package tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi

          package="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].name)')"
          version="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].version)')"
          integrity="$(node -e 'process.stdout.write(require("./release-artifact/pack.json")[0].integrity)')"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "${tarballs[0]}" | openssl base64 -A)"
          if [[ "$package" != "robot-heads-solid" || "$version" != "$EXPECTED_VERSION" || "$integrity" != "$actual_integrity" ]]; then
            echo "Release artifact identity or integrity verification failed." >&2
            exit 1
          fi

          if npm view "${package}@${version}" version --registry=https://registry.npmjs.org/ --prefer-online >/dev/null 2>&1; then
            echo "${package}@${version} already exists. Refusing to reuse an npm version." >&2
            exit 1
          fi

          npm publish "${PWD}/${tarballs[0]}" --access public --tag "$DIST_TAG" --provenance
