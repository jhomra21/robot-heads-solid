<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>robot-heads-solid</title>
  <meta name="description" content="Animated robot heads for Solid. Four shapes, nine states, rendered with Canvas 2D. Solid port of Fayaz Ahmed's robot-heads." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="preload" href="https://raw.githubusercontent.com/fayazara/robot-heads/main/site/public/fonts/OpenRunde-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    try {
      var saved = localStorage.getItem('robot-heads-solid-theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (_) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
